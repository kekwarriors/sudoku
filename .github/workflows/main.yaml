name: sudoku

permissions:
    contents: read
    pages: write
    id-token: write

on:
    push:
        branches:
            - main

jobs:
    build-deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version: 20
            - run: npm ci && npm run build
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist
            - uses: actions/deploy-pages@v4
              id: deployment
